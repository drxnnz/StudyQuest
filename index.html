.btn .ic{width:15px;height:15px;vertical-align:0}.btn.small .ic{width:13px;height:13px}
.nav-icon>.ic{width:19px;height:19px;display:block;margin:auto}
.icon-btn .ic{width:18px;height:18px}
.tab-symbol .ic{width:14px;height:14px}
.mode-ico .ic{width:24px;height:24px;display:block;margin:0 auto}
.empty-icon .ic{width:34px;height:34px;display:block;margin:0 auto}
.subject-icon .ic{width:20px;height:20px;display:block}
.file-drop-icon .ic{width:24px;height:24px;display:block}
.search span .ic{width:16px;height:16px;display:block}
.export-chevron .ic{width:16px;height:16px;display:block}
.result-ring:after{content:"";width:22px;height:22px;background:var(--accent);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.select-enhanced-option[aria-selected="true"]::after{content:"";display:inline-block;width:5px;height:10px;border:solid var(--accent);border-width:0 2px 2px 0;transform:rotate(45deg);font-size:0}

/* ===== Polish pass: tab text contrast + lighter, smoother page transitions ===== */
.workflow-tabs .workflow-tab b,.workflow-tabs .workflow-tab small,.create-tabs .tab,.create-tabs .tab *{transition:color .25s var(--motion-out),opacity .25s var(--motion-out)}
.workflow-tabs .workflow-tab:not(.active) b{color:var(--text)}
.workflow-tabs .workflow-tab:not(.active) small{color:var(--muted)}
.workflow-tabs .workflow-tab.active b,.workflow-tabs .workflow-tab.active small,.workflow-tabs .workflow-tab.active .workflow-tab-copy *{color:#fff!important;opacity:1}
.workflow-tabs .workflow-tab.active small{opacity:.88}
.create-tabs .tab.active,.create-tabs .tab.active *{color:#fff!important}
.create-tabs .tab:not(.active) .tab-symbol{color:var(--accent)}
.workflow-tab.active .workflow-number{text-shadow:0 1px 2px rgba(0,0,0,.18)}
.workflow-tabs .workflow-slider,.create-tabs .tabs-slider{transition:transform .42s cubic-bezier(.22,1,.36,1);will-change:transform}
.workflow-switch-track,.create-mode-track{transition:transform .46s cubic-bezier(.22,1,.36,1)}
.workflow-switch-viewport,.create-mode-viewport{transition:height .4s cubic-bezier(.22,1,.36,1)}

@keyframes vOutF{to{opacity:0;transform:translate3d(0,-10px,0)}}
@keyframes vOutB{to{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes vInF{from{opacity:0;transform:translate3d(0,16px,0)}}
@keyframes vInB{from{opacity:0;transform:translate3d(0,-16px,0)}}
.view.exit-forward{animation:vOutF .13s cubic-bezier(.4,0,1,1) forwards}
.view.exit-backward{animation:vOutB .13s cubic-bezier(.4,0,1,1) forwards}
.view.enter-forward{animation:vInF .3s cubic-bezier(.16,1,.3,1) both}
.view.enter-backward{animation:vInB .3s cubic-bezier(.16,1,.3,1) both}
.nav-active-slider{transition:transform .38s cubic-bezier(.22,1,.36,1),height .26s cubic-bezier(.22,1,.36,1),opacity .16s ease}
@media(prefers-reduced-motion:reduce){.view.exit-forward,.view.exit-backward,.view.enter-forward,.view.enter-backward{animation:none!important}}

/* ===== Same-view re-render (dropdowns/toggles): no replayed entrance, no height collapse ===== */
#view.same-view .page-head,#view.same-view .section-head,#view.same-view .view-inner:not(.study-layout)>*,#view.same-view .layout-two>.panel,#view.same-view .workflow-tabs,#view.same-view .workflow-slide-panel,#view.same-view .create-mode-panel,#view.same-view .library-toolbar,#view.same-view .grid>*{animation:none!important}
#view.rr .workflow-switch-viewport,#view.rr .create-mode-viewport,#view.rr .workflow-switch-track,#view.rr .create-mode-track,#view.rr .workflow-slider,#view.rr .tabs-slider,#view.rr .select-enhanced-menu{transition:none!important}
.select-enhanced-option{transition:background .15s var(--motion-out),color .15s var(--motion-out)}

/* ===== Workflow tabs: the copy <span> was inheriting the 34px icon-badge rules ===== */
.workflow-tabs .workflow-tab>.workflow-tab-copy{width:auto;height:auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:none;border-radius:0;font-size:inherit;font-weight:inherit;grid-row:auto;transform:none;place-items:initial;text-align:left}
.workflow-tabs .workflow-tab{justify-content:center;gap:10px}
.workflow-tabs .workflow-tab>.workflow-tab-copy small{white-space:nowrap}

/* ===== Quiz screen placement: top-aligned, stable positions, readable choices ===== */
.study-layout{max-width:1080px;margin-inline:auto;gap:clamp(10px,1.6vh,18px)}
body .study-layout>.panel,body.quiz-focus-active .study-layout>.panel{flex:0 0 auto;min-height:clamp(380px,56vh,620px);justify-content:flex-start;overflow:auto;padding:clamp(20px,3.2vw,44px) clamp(18px,3.4vw,48px);align-self:stretch}

.choice .key{flex:0 0 auto;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;transition:background .18s,color .18s,border-color .18s}

.choice:hover:not(:disabled) .key{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
body .study-layout>.panel .feedback,body.quiz-focus-active .study-layout>.panel .feedback{margin-top:clamp(14px,2vh,22px)}
.study-actions{margin-top:2px}

@media(max-width:640px){body .study-layout>.panel,body.quiz-focus-active .study-layout>.panel{min-height:0;padding:16px 14px}body .study-layout>.panel .choices,body.quiz-focus-active .study-layout>.panel .choices{grid-template-columns:1fr!important;grid-auto-rows:auto!important}body .study-layout>.panel .page-title,body.quiz-focus-active .study-layout>.panel .page-title{font-size:clamp(19px,5.4vw,24px)!important}}

}

/* ===== v8: consistent logo / nav icon colors, brand text fit, import row ===== */

/* ===== v9: blocky switches, equal settings buttons, accent colors ===== */
.btn.primary,.create-tabs .tabs-slider,.workflow-tabs .workflow-slider{background:linear-gradient(145deg,var(--ico-a),var(--ico-b))!important;color:#fff!important}
.btn.primary{border-color:transparent!important;box-shadow:0 4px 0 var(--ico-shadow),0 8px 15px color-mix(in srgb,var(--ico-a) 24%,transparent)!important}

.settings-row.stack{flex-direction:column;align-items:stretch;gap:12px}

.swatch.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 0 0 3px var(--surface),0 0 0 5px var(--sw,var(--accent))}

/* ===== Quiz polish + motion (flashcard type, dropdown look, in-game transitions) ===== */
/* Flashcard answer typography */
.flashcard .back{font-weight:800;letter-spacing:-.03em;line-height:1.3;margin-top:14px;text-wrap:balance;color:var(--text)}
.flashcard .eyebrow{margin-bottom:6px}
.flashcard .feedback{max-width:min(640px,100%);margin:18px 0 0;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:500;line-height:1.55;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--accent) 7%,var(--surface2));border:1px solid color-mix(in srgb,var(--accent) 14%,var(--line))}
.flashcard .feedback b{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.flashcard .tap-hint{font-weight:600;letter-spacing:.02em}

.study-layout>.panel .page-title{font-weight:800;letter-spacing:-.035em}
/* Dropdowns: selected value no longer looks like a default control */
.select-enhanced-trigger{font-size:13px;transition:border-color .2s,box-shadow .2s,background .2s,transform .22s var(--motion-spring)}
.select-enhanced-trigger .select-value{font-weight:700;color:var(--text);letter-spacing:-.005em}
.select-enhanced-trigger:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.select-enhanced-trigger:active{transform:scale(.985)}
.select-enhanced.open .select-enhanced-trigger{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.select-enhanced-trigger .select-chevron{color:var(--accent)}
.select-enhanced-option{font-size:13px;font-weight:600;transition:background .15s var(--motion-out),color .15s var(--motion-out),transform .15s var(--motion-out)}
.select-enhanced-option:hover{transform:translateX(2px)}
.select-enhanced-option[aria-selected="true"]{color:var(--accent);font-weight:800}
.field input,.field textarea{font-weight:600;transition:border-color .2s,box-shadow .2s,background .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
@media(prefers-reduced-motion:no-preference){
@keyframes qRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes qChoiceIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes qPop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes qResolve{from{background:var(--surface);border-color:var(--line)}}
@keyframes qGlowGood{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--good) 0%,transparent)}}
@keyframes qDim{from{opacity:1}}
@keyframes qFeedback{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes qFlip{0%{opacity:.2;transform:perspective(1100px) rotateY(-88deg) scale(.96)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes qFill{from{width:var(--from,0%)}}
@keyframes qOpt{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* new question enters: header, claim, choices stagger in (only on a fresh card, not when answering) */
.study-layout.is-fresh>.panel .eyebrow,.study-layout.is-fresh>.panel .page-title{animation:qRise .38s var(--motion-out) backwards}
.study-layout.is-fresh>.panel .tf-claim,.study-layout.is-fresh>.panel .type-blanks,.study-layout.is-fresh>.panel .type-field{animation:qRise .4s var(--motion-out) .08s backwards}
.study-layout.is-fresh .choices .choice{animation:qChoiceIn .42s var(--motion-spring) backwards}
.study-layout.is-fresh .choices .choice:nth-child(1){animation-delay:.08s}
.study-layout.is-fresh .choices .choice:nth-child(2){animation-delay:.14s}
.study-layout.is-fresh .choices .choice:nth-child(3){animation-delay:.2s}
.study-layout.is-fresh .choices .choice:nth-child(4){animation-delay:.26s}
.study-layout.is-fresh .choices .choice:nth-child(n+5){animation-delay:.32s}
/* hover / press feel */
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 8px 20px color-mix(in srgb,var(--text) 9%,transparent)}
.choice:active:not(:disabled){transform:scale(.98)}
.study-actions .btn:active{transform:scale(.97)}
/* answer resolves: smooth colour fade, glow on correct, shake on wrong, others dim */
.choice.correct{animation:pulseGood .38s var(--motion-spring),qResolve .35s var(--motion-out),qGlowGood .65s ease-out}
.choice.wrong{animation:shake .34s,qResolve .3s var(--motion-out)}
.study-layout.is-answered .choice:not(.correct):not(.wrong){opacity:.5;animation:qDim .35s var(--motion-out)}
.feedback{animation:qFeedback .38s var(--motion-spring) backwards}
.hint-line{animation:qRise .32s var(--motion-out) backwards}
@media(prefers-reduced-motion:reduce){.hint-line{animation:none!important}}
.fb-why{animation:qFeedback .4s var(--motion-spring) .12s backwards}
.fb-example{animation:qFeedback .4s var(--motion-spring) .18s backwards}
/* flashcard flip + staggered back content */
.flashcard.revealed{animation:qFlip .5s var(--motion-out)}
.flashcard.revealed .back{animation:qRise .36s var(--motion-out) .14s backwards}
.flashcard.revealed .feedback{animation:qRise .36s var(--motion-out) .24s backwards}
.flashcard.revealed .tap-hint{animation:qRise .3s var(--motion-out) .34s backwards}
.study-layout.is-answered .study-actions .btn{animation:qRise .32s var(--motion-out) backwards}
.study-layout.is-answered .study-actions .btn:nth-child(2){animation-delay:.05s}
.study-layout.is-answered .study-actions .btn:nth-child(3){animation-delay:.1s}
.study-layout.is-answered .study-actions .btn.primary{animation:qRise .32s var(--motion-out) .1s backwards,qPop .5s var(--motion-spring) .45s}
/* progress bar fills from the previous position, chips bump when score rises */
.study-progress span{animation:qFill .6s var(--motion-out);transition:width .45s var(--motion-out)}
.tag.bump{animation:qPop .5s var(--motion-spring)}

.view-inner:has(.result-score) .stat{animation:qRise .45s var(--motion-out) backwards}
.view-inner:has(.result-score) .stat:nth-child(2){animation-delay:.07s}
.view-inner:has(.result-score) .stat:nth-child(3){animation-delay:.14s}
.view-inner:has(.result-score) .stat:nth-child(4){animation-delay:.21s}
/* dropdown menu options cascade in */
.select-enhanced.open .select-enhanced-option{animation:qOpt .22s var(--motion-out) backwards}
.select-enhanced.open .select-enhanced-option:nth-child(2){animation-delay:.02s}
.select-enhanced.open .select-enhanced-option:nth-child(3){animation-delay:.04s}
.select-enhanced.open .select-enhanced-option:nth-child(4){animation-delay:.06s}
.select-enhanced.open .select-enhanced-option:nth-child(n+5){animation-delay:.08s}
}

--kb:0px;--idle-fade:240ms}

/* ===== IDLE / AMBIENT EFFECTS (body.is-idle, set by the idle block in JS) ===== */

html[data-look="mc"] .ai-orb{border-radius:0;-webkit-mask:none;mask:none;width:30px;height:30px;background:linear-gradient(#5d9b2f 0 35%,#8a5a33 35%);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.3);animation:mcBob 1s steps(4) infinite}
@keyframes mcBob{50%{transform:translateY(-5px) rotate(90deg)}}
html[data-look="mc"] .ai-bar{border-radius:0;height:18px;background:#101010;border:2px solid #000;position:relative}
html[data-look="mc"] .ai-bar>i{background:#55ff55;border-radius:0}
html[data-look="mc"] .ai-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,#000 12px 14px);pointer-events:none}
html[data-look="mc"] .ai-step{border-radius:0;border:2px solid #000}
@media(max-width:640px){.page-head .page-subtitle{display:none}.page-title{font-size:25px!important}.panel{padding:14px}.view-inner{padding-left:12px;padding-right:12px}.page-head{gap:10px;margin-bottom:12px}}

/* ===== v8: wrap fixes, collapsible provider, tap cards, chatbot ===== */
:is(.btn,.chip,.tab,.choice,.look-opt,.ai-mode-btn){min-width:0;white-space:normal;word-break:normal;overflow-wrap:break-word;hyphens:none;line-height:1.2}
html[data-look="mc"] :is(.btn,.chip,.tab,.choice,.look-opt){box-sizing:border-box;padding-inline:12px}
.eq-grid,.mode-grid{min-width:0}.eq-grid>*,.mode-grid>*{min-width:0}
@media(max-width:480px){.eq-grid,.eq-grid.c4w{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))!important}}
.prov-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.prov-title{display:block;font-size:17px}.prov-chev{display:grid;place-items:center;width:30px;height:30px;transition:transform .25s}.prov-chev .ic{width:18px;height:18px}
.prov-head[aria-expanded="false"] .prov-chev{transform:rotate(-90deg)}
.prov-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease;margin-top:10px}.prov-wrap.closed{grid-template-rows:0fr}
.prov-wrap>div{min-height:0}.prov-wrap.closed>div{overflow:hidden;visibility:hidden}
.tap-card{cursor:pointer}.tap-hint{display:block;margin:2px 0 0;font-size:11px;color:var(--muted)}
.tap-card.revealed .tap-hint{display:none}.tap-card:not(.revealed) :is(.card-ans,.card-exp){display:none}
.tap-card.revealed .card-ans{animation:tapIn .2s ease}@keyframes tapIn{from{opacity:0;transform:translateY(-3px)}}
#sqBotFab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9000;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer}
html[data-look="mc"] #sqBotFab{border-radius:0;border:2px solid #000}
#sqBot{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:9001;width:min(380px,calc(100vw - 32px));height:min(520px,70vh);display:none;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
#sqBot.open{display:flex}.sqb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
#sqLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.sqm{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:break-word}
.sqm.u{align-self:flex-end;background:var(--accent);color:#fff}.sqm.b{align-self:flex-start;background:var(--surface2)}.sqm.s{align-self:center;font-size:12px;color:var(--muted);background:none}
.sqb-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.sqb-in input{flex:1;min-width:0}
@media(max-width:560px){#sqBot{right:8px;left:8px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

#sqBotFab{padding:7px;background:#4a3fc4;display:grid;place-items:center}#sqBotFab svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.sqb-t{display:flex;align-items:center;gap:8px}.sqb-logo{width:26px;height:26px;display:inline-block}
.sq-dots{display:inline-flex;gap:4px;align-items:center;height:18px}.sq-dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:sqBounce 1.1s infinite ease-in-out}
.sq-dots i:nth-child(2){animation-delay:.15s}.sq-dots i:nth-child(3){animation-delay:.3s}
@keyframes sqBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@media(prefers-reduced-motion:reduce){.sq-dots i{animation:none;opacity:.7}}

/* ===== v9 ===== */
.action-menu{z-index:10050!important}
.lesson-actions{display:flex;gap:8px}.lesson-actions .study-wide{flex:1}.lesson-actions .more-btn{flex:0 0 40px;width:40px;padding:0}
.fmt-dd>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}.fmt-dd>summary::-webkit-details-marker{display:none}
.dd-chev{display:grid;transition:transform .2s}.dd-chev .ic{width:20px;height:20px}.fmt-dd[open] .dd-chev{transform:rotate(180deg)}
.byok-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.byok-head-b{display:flex;gap:6px}
.byok-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.byok-row small{display:block;color:var(--muted);overflow-wrap:anywhere}.byok-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.byok-add{display:grid;gap:8px;margin-top:14px}
.sqb-btns{display:flex;gap:4px}.sqb-btns .icon-btn{width:34px;height:34px}
#sqHist{flex:1;overflow:auto;padding:10px;display:none;flex-direction:column;gap:6px}
#sqBot.hist #sqHist{display:flex}#sqBot.hist #sqLog,#sqBot.hist .sqb-in{display:none}
.sqh-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.sqh-row b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sqh-row small{color:var(--muted);font-size:11px}

/* ===== v10: text contrast pass (default + Minecraft, light + dark) ===== */
:root{--muted:#566179;--good:#0f7a54;--bad:#b3304a;--accent:#5249cc;--accent3:#3c33a8;--ico-a:#6259e6}
[data-theme="dark"]{--muted:#adb7ce;--text:#f2f4ff}
html[data-look="mc"]{--text:#141414;--muted:#383838;--accent:#1f5209;--accent3:#17400a;--good:#1f5f0b;--bad:#8f1f1f}
html[data-look="mc"][data-theme="dark"]{--text:#f6f6f6;--muted:#d0d0d0;--accent:#8fe05a;--accent3:#c4f2a0;--good:#8fe05a;--bad:#ff9a9a}
html[data-look="mc"] .btn.primary{background:#3f7a1b;color:#fff}
html[data-look="mc"] .btn.primary:not(:disabled):hover{background:#4a8c22}
html[data-look="mc"] .view-inner>.page-head :is(h1,h2,.page-title){color:#fff;text-shadow:2px 2px 0 #000}
html[data-look="mc"] .view-inner>.page-head :is(p,.page-subtitle){color:#f6ead8;text-shadow:1px 1px 0 #000}
html[data-look="mc"] .view-inner>.page-head .eyebrow,html[data-look="mc"] .view-inner>.section-head .eyebrow{color:#ffe28a;text-shadow:1px 1px 0 #000}
html[data-look="mc"] :is(.view-inner>.section-head,.view-inner>.fmt-dd>summary) :is(h2,h3,p){color:#fff;text-shadow:2px 2px 0 #000}
html[data-look="mc"] .view-inner>.crumbs :is(button,b,.sep){color:#fff;text-shadow:1px 1px 0 #000}
</style>

/* FN: manualCreateView — manual card form HTML */

/* FN: createOrSelectDestination — pick/create subject+lesson for new card */
function createOrSelectDestination(){const sel=$("#manualSubject")?.value;let s=sel?getSubject(sel):null;const name=$("#newSubjectName")?.value.trim();if(!s&&name){s={id:uid(),name,title:$("#newSubjectTitle")?.value.trim()||"",createdAt:Date.now(),lessons:[]};db.subjects.push(s);save();selectedSubject=s.id}if(!s){toast("Choose an existing subject or enter a new subject name.");return}const lessonId=$("#manualLesson")?.value;let l=lessonId?s.lessons.find(x=>x.id===lessonId):null;const lessonName=$("#newLessonName")?.value.trim();if(!l&&lessonName){l={id:uid(),name:lessonName,term:$("#newLessonTerm")?.value||"General",cards:[]};s.lessons.push(l);selectedLesson=l.id;save()}else if(l)selectedLesson=l.id;selectedSubject=s.id;render();toast("Destination saved.")}
/* FN: ensureDestination — ensure subject/lesson exist before save */

/* FN: saveManualCard — save card from manual form into db */

/* FN: clearManualCard — reset manual create form fields */

/* FN: switchImportStep — switch Prompt vs Paste import steps */
function switchImportStep(next){
 if(next===importStep)return;
 const viewport=$(".workflow-switch-viewport"),track=$(".workflow-switch-track"),tabs=$(".workflow-tabs");
 const panels=$$(".workflow-slide-panel"),buttons=$$(".workflow-tabs .workflow-tab");
 const active=viewport?.querySelector(".workflow-slide-panel.active");
 const oldHeight=active?Math.ceil(active.getBoundingClientRect().height||active.scrollHeight):0;
 if(viewport&&oldHeight){viewport.style.height=oldHeight+"px";viewport.style.overflow="hidden"}
 importStep=next;
 tabs?.classList.toggle("active-step-2",next==="output");
 track?.classList.toggle("active-step-2",next==="output");
 buttons.forEach((b,i)=>b.classList.toggle("active",(i===0&&next==="prompt")||(i===1&&next==="output")));Sound.play(next==="output"?"whoosh":"whooshBack");
 panels.forEach((panel,i)=>panel.classList.toggle("active",(i===0&&next==="prompt")||(i===1&&next==="output")));
 if(viewport){
  const targetPanel=viewport.querySelector(".workflow-slide-panel.active");
  viewport.getBoundingClientRect();
  const target=Math.ceil(targetPanel?.getBoundingClientRect().height||targetPanel?.scrollHeight||0);
  viewport.style.transition="height 360ms cubic-bezier(.4,0,.2,1)";
  if(target>0)viewport.style.height=target+"px";
  let done=false;
  const cleanup=()=>{if(done)return;done=true;viewport.style.transition="";viewport.style.overflow="hidden";if(target>0)viewport.style.height=target+"px";viewport.removeEventListener("transitionend",onEnd);try{syncWorkflowSlideHeight()}catch(e){}};
  const onEnd=e=>{if(e.target===viewport&&e.propertyName==="height")cleanup()};
  viewport.addEventListener("transitionend",onEnd);setTimeout(cleanup,440);
 }
 syncCreateSlideHeight();
 syncWorkflowSlideHeight();
}

/* FN: editCard — modal to edit one card fields */
function editCard(sid,lid,cid){const c=getLesson(sid,lid)?.cards.find(x=>x.id===cid);if(!c)return;openModal(`<div class="modal-head"><div><h2>Edit study card</h2><p>Changes save to your local study collection.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="field"><label>Front / question *</label><textarea id="editFront">${esc(c.front)}</textarea></div><div class="field"><label>Back / answer *</label><textarea id="editBack">${esc(c.back)}</textarea></div><div class="field"><label>Explanation</label><textarea id="editExplanation">${esc(c.explanation||"")}</textarea></div><div class="field"><label>Example</label><textarea id="editExample">${esc(c.example||"")}</textarea></div>${[1,2,3].map(i=>`<div class="field"><label>Hint ${i}</label><input id="editHint${i}" value="${esc(c.hints?.[i-1]||"")}"></div>`).join("")}<div class="field"><label>Tags</label><input id="editTags" value="${esc((c.tags||[]).join(", "))}"></div><div class="field"><label>Question pool</label><select id="editPool"><option value="core" ${c.pool!=="additional"?"selected":""}>Core question</option><option value="additional" ${c.pool==="additional"?"selected":""}>Additional practice</option></select></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEditedCard('${sid}','${lid}','${cid}')">Save card</button></div>`)}

/* FN: duplicateCard — clone a card in same lesson */
function duplicateCard(sid,lid,cid){const l=getLesson(sid,lid),c=l?.cards.find(x=>x.id===cid);if(!c)return;const copy=normalizeCard({...JSON.parse(JSON.stringify(c)),id:uid(),front:c.front+" (copy)"});l.cards.push(copy);save();render();requestAnimationFrame(()=>{const el=$$(".card-row").find(x=>x.dataset.cardId===copy.id);if(el)el.classList.add("duplicated-in")});toast("Card duplicated.")}
/* FN: deleteCard — remove card from lesson */

/* FN: deckExportText — build StudyDeck text for one subject */
function deckExportText(s){const rows=[FORMAT];s.lessons.forEach(l=>l.cards.forEach(c=>{const hints=(c.hints||[]).slice(0,3);const tags=(c.tags||[]).filter(t=>!/^__hint(?:2|3)?__:/i.test(String(t).trim())&&!/^__example__:/i.test(String(t).trim())&&!/^__distractors__:/i.test(String(t).trim()));if(c.tf===true)tags.push("tf:true");if(c.tf===false)tags.push("tf:false");if(String(c.example||"").trim())tags.push("__example__:"+encodeURIComponent(c.example.trim()));const ds=(c.distractorCandidates||[]).map(x=>String(x).trim()).filter(Boolean);if(ds.length)tags.push("__distractors__:"+encodeURIComponent(JSON.stringify(ds)));if((c.distractorWhy||[]).some(Boolean))tags.push("__why__:"+encodeURIComponent(JSON.stringify(c.distractorWhy)));if((c.tfStatements||[]).length)tags.push("__tfs__:"+encodeURIComponent(JSON.stringify(c.tfStatements)));if((c.accept||[]).length)tags.push("__accept__:"+encodeURIComponent(JSON.stringify(c.accept)));if(c.pool==="additional")tags.push("pool:additional");rows.push([s.name,l.name,c.front,c.back,c.explanation||"",hints[0]||c.hint||"",hints[1]||"",hints[2]||"",tags.join(", ")].map(v=>String(v??"").replace(/[\t\r\n]+/g," ")).join("\t"))}));return "\uFEFF"+rows.join("\n")}
/* FN: safeFileName — sanitize string for download filename */
function safeFileName(s){return String(s||"studydeck").replace(/[\\/:*?"<>|]+/g,"-").trim()||"studydeck"}
/* FN: downloadText — trigger browser file download */
function downloadText(text,filename,type="text/plain;charset=utf-8"){try{const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);return true}catch(err){console.error(err);toast("Download was blocked by the browser. Try Copy TSV instead.");return false}}
/* FN: exportSubject — download subject as StudyDeck or JSON */

 openModal(`<div class="modal-head"><div><div class="eyebrow">Selective export</div><h2>Choose subjects or cards</h2><p>Select a whole subject or expand it to choose individual cards. Then download a text file or copy the StudyDeck TSV to your clipboard.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="export-toolbar"><label class="checkbox-row"><input type="checkbox" id="exportSelectAll" onchange="toggleAllExport(this.checked)"><span>Select all</span><span id="exportSelectionCount" class="tag">0 selected</span></label><button type="button" class="btn small danger" id="exportDeleteBtn" onclick="bulkDeleteSelected()" disabled>${icon("trash")}<span>Delete selected</span></button></div><div class="export-picker-list">${groups}</div><div class="field" style="margin-top:14px"><label>Export method</label><div class="seg" id="exportMethodSeg" role="radiogroup" aria-label="Export method"><button type="button" class="seg-btn active" role="radio" aria-checked="true" data-method="download" onclick="setExportMethod('download')">${icon("down")}Download TXT</button><button type="button" class="seg-btn" role="radio" aria-checked="false" data-method="copy" onclick="setExportMethod('copy')">${icon("copy")}Copy TSV</button></div><input type="hidden" id="exportOutputMethod" value="download"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="exportGoBtn" onclick="exportSelectedItems()">${icon("down")}Download selected</button></div>`);

/* FN: toggleExportGroup — expand/collapse export subject group */
function toggleExportGroup(index){
 const panel=document.querySelector(`[data-export-group-panel="${index}"]`),button=document.querySelector(`[data-export-toggle="${index}"]`);
 if(!panel||!button)return;
 const opening=button.getAttribute('aria-expanded')!=='true';
 button.setAttribute('aria-expanded',String(opening));
 if(opening){
  panel.hidden=false;panel.classList.remove('is-open');panel.style.maxHeight='0px';panel.style.opacity='0';
  requestAnimationFrame(()=>{if(button.getAttribute('aria-expanded')!=='true')return;panel.classList.add('is-open');panel.style.maxHeight=panel.scrollHeight+'px';panel.style.opacity='1';});
  const finishOpen=e=>{if(e.propertyName!=='max-height'||button.getAttribute('aria-expanded')!=='true')return;panel.style.maxHeight='none';panel.removeEventListener('transitionend',finishOpen)};
  panel.addEventListener('transitionend',finishOpen);
 }else{
  panel.style.maxHeight=panel.scrollHeight+'px';panel.style.opacity='1';panel.classList.add('is-open');
  panel.getBoundingClientRect();
  requestAnimationFrame(()=>{if(button.getAttribute('aria-expanded')==='true')return;panel.style.maxHeight='0px';panel.style.opacity='0';panel.classList.remove('is-open')});
  const finishClose=e=>{if(e.propertyName!=='max-height'||button.getAttribute('aria-expanded')==='true')return;panel.hidden=true;panel.removeEventListener('transitionend',finishClose)};
  panel.addEventListener('transitionend',finishClose);
 }
}

/* FN: updateExportCount — update selected-count label in export UI */
function updateExportCount(){const cards=[...document.querySelectorAll('[data-export-card]')],count=cards.filter(c=>c.checked).length;const el=document.getElementById('exportSelectionCount');if(el)el.textContent=`${count} selected`;const del=document.getElementById('exportDeleteBtn');if(del){del.disabled=!count;const sp=del.querySelector('span');if(sp)sp.textContent=count?`Delete (${count})`:'Delete selected'}document.querySelectorAll('[data-export-subject]').forEach(s=>{const children=cards.filter(c=>c.dataset.exportSubjectId===s.dataset.exportSubject);s.checked=children.length>0&&children.every(c=>c.checked);s.indeterminate=children.some(c=>c.checked)&&!s.checked});const all=document.getElementById('exportSelectAll');if(all){all.checked=cards.length>0&&count===cards.length;all.indeterminate=count>0&&count<cards.length}}

/* FN: selectedExportText — build text from export picker selection */
function selectedExportText(cards){const rows=[];for(const s of db.subjects){const picked=cards.filter(x=>x.dataset.exportSubjectId===s.id);if(!picked.length)continue;const lessonCopies=[];for(const l of s.lessons){const ids=new Set(picked.filter(x=>x.dataset.exportLessonId===l.id).map(x=>x.dataset.exportCard));const chosen=l.cards.filter(c=>ids.has(c.id));if(chosen.length)lessonCopies.push({...l,cards:chosen})}const partial={...s,lessons:lessonCopies};let txt=deckExportText(partial).replace(/^\uFEFF/,'');const header=FORMAT+'\n';txt=txt.startsWith(header)?txt.slice(header.length):txt;rows.push(txt)}return '\uFEFF'+FORMAT+(rows.filter(Boolean).length?'\n'+rows.filter(Boolean).join('\n'):'')}

/* FN: exportOneCard — export a single card as StudyDeck line */

/* FN: exportOneCardNow — immediate download of one card */

/* FN: importBackup — restore workspace from JSON backup file */
function importBackup(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(!d||!Array.isArray(d.subjects))throw Error();confirmModal("Restore backup?","This will replace the current subject library with the backup data.","Restore backup",()=>{db={...d,subjects:d.subjects.map(normalizeSubject),deletedDecks:Array.isArray(d.deletedDecks)?d.deletedDecks:[]};save();closeModal();render();toast("Backup restored.")})}catch{toast("That file is not a valid workspace JSON backup.")}};r.readAsText(f)}
/* FN: normalizeStudyDeckText — normalize newlines/BOM in import text */
function normalizeStudyDeckText(raw){return String(raw??"").replace(/^\uFEFF/,"").replace(/\u0000/g,"").replace(/\r\n?/g,"\n").replace(/\u2028|\u2029/g,"\n")}
/* FN: normalizeStudyDeckMetadataLine — clean metadata header lines */
function normalizeStudyDeckMetadataLine(line){return String(line??"").replace(/^\uFEFF/,"").replace(/[\u200B\u200C\u200D\u2060]/g,"").trim()}
/* FN: normalizeDataLine — normalize one TSV data line */
function normalizeDataLine(line){return String(line??"").replace(/\\t/g,"\t").replace(/\\u0009/gi,"\t").replace(/[\u200B\u200C\u200D\u2060\uFEFF]/g,"")}

/* FN: aiResultHTML — status, errors and the preview */
function aiResultHTML(){const a=aiState;let h="";

 else if(a.status&&!a.rows&&!a.error)h+=`<div class="feedback">${esc(a.status)}</div>`;

 return h}

/* ===== F. SESSION SETUP + STUDY LOOP ===== */
/* FN: openSessionSetup — modal: pick mode, timer, start study */
function openSessionSetup(subjectId="all",lessonId="all"){sessionSetup.subject=subjectId||"all";sessionSetup.lesson=lessonId||"all";sessionSetup.mode="flash";sessionSetup.speedrun=false;sessionSetup.seconds=60;const eligible=cardsForSetup();openModal(`<div class="modal-head"><div><div class="eyebrow">Session setup</div><h2>Choose your study mode</h2><p>Choose a subject, a lesson, and how you want to practice.</p></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>Subject</label><select id="setupSubject" onchange="updateSetupLesson()"><option value="all">All subjects</option>${db.subjects.map(s=>`<option value="${s.id}" ${sessionSetup.subject===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Lesson</label><select id="setupLesson"><option value="all">All lessons</option></select></div><div class="field"><label>Number of cards</label><select id="setupCount"><option value="all">All available</option><option>5</option><option>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Session type</label><select id="setupSpeedrun"><option value="normal">Normal practice</option><option value="speedrun">Speedrun (timed)</option></select></div></div><div class="section-head"><h3>Study mode</h3><span class="tag">${eligible.length} cards available</span></div><div class="grid mode-grid">${[["flash",icon("flash"),"Flashcards","Reveal, then rate confidence"],["mcq",icon("mcq"),"Multiple Choice","Choose the best answer"],["type",icon("type"),"Type Answer","Recall from memory"],["tf",icon("tf"),"True / False","Statements generated from cards"],["mixed",icon("sparkle"),"Mixed","Random mix of choices, True / False and typing"]].map(([id,ico,name,desc])=>`<button class="mode-option ${sessionSetup.mode===id?"active":""}" onclick="sessionSetup.mode='${id}';$$('.mode-option').forEach(x=>x.classList.remove('active'));this.classList.add('active')"><div class="mode-ico">${ico}</div><b>${name}</b><small>${desc}</small></button>`).join("")}</div><div class="field"><label>Speedrun time limit</label><select id="setupSeconds" onchange="setCustomTimerFields(this.value==='custom')"><option value="30">30 seconds</option><option value="60" selected>1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="custom">Custom</option></select><div id="customTimerFields" class="form-grid" aria-hidden="true"><div class="field"><label>Minutes</label><input id="customMinutes" type="number" min="0" max="180" value="5"></div><div class="field"><label>Seconds</label><input id="customSeconds" type="number" min="0" max="59" value="0"></div></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="beginSession()">${icon("play")}Start studying →</button></div>`);setCustomTimerFields(false);updateSetupLesson()}
/* FN: updateSetupLesson — refresh lesson dropdown in session setup */
function updateSetupLesson(){const sid=$("#setupSubject")?.value||sessionSetup.subject;sessionSetup.subject=sid;const ls=sid==="all"?db.subjects.flatMap(s=>s.lessons.map(l=>({id:l.id,name:s.name+" / "+l.name}))):getSubject(sid)?.lessons.map(l=>({id:l.id,name:l.name}))||[];const el=$("#setupLesson");if(!el)return;el.innerHTML=`<option value="all">All lessons</option>${ls.map(l=>`<option value="${l.id}" ${sessionSetup.lesson===l.id?"selected":""}>${esc(l.name)}</option>`).join("")}`;if(!ls.some(l=>l.id===sessionSetup.lesson))sessionSetup.lesson="all";el.value=sessionSetup.lesson}
/* FN: cardsInSelectedScope — count cards in current setup selection */
function cardsInSelectedScope(){let c=allCardRefs();if(sessionSetup.subject!=="all")c=c.filter(x=>x.subjectId===sessionSetup.subject);if(sessionSetup.lesson!=="all")c=c.filter(x=>x.lessonId===sessionSetup.lesson);return c}
/* FN: cardsForSetup — cards for chosen subject/lesson scope */
function cardsForSetup(){return cardsInSelectedScope().filter(x=>x.pool!=="additional")}
/* FN: additionalCardsForSetup — extra-practice cards in session setup */
function additionalCardsForSetup(){return cardsInSelectedScope().filter(x=>x.pool==="additional")}
/* FN: hasTF — true if card has true/false metadata */
function hasTF(c){return typeof c.tf==="boolean"||/^(true|false|tama|mali)$/i.test(String(c.back||"").trim())||/true\s*\/?\s*false|tama\s*\/?\s*mali/i.test(c.front||"")}
/* FN: planMixed — plan mode order for mixed study session */
function planMixed(cards){const base=cards.length>=4?["mcq","mcq","tf","type","type"]:cards.length>=2?["tf","type"]:["type"],plan=[];cards.forEach((c,i)=>{let m,t=0;do{m=base[Math.random()*base.length|0];t++}while(t<8&&i>=2&&plan[i-1]===m&&plan[i-2]===m);if(typeof c.tf==="boolean"&&base.includes("tf")&&Math.random()<.6)m="tf";plan.push(m)});return plan}
/* FN: initMixed — plan mode sequence for mixed sessions */
function initMixed(s){if(s&&s.baseMode==="mixed"){s.plan=planMixed(s.cards);s.mode=s.plan[0]||"type"}}
/* FN: beginSession — finalize setup options and start study */
function beginSession(){sessionSetup.subject=$("#setupSubject")?.value||"all";sessionSetup.lesson=$("#setupLesson")?.value||"all";sessionSetup.speedrun=$("#setupSpeedrun")?.value==="speedrun";const secondsValue=$("#setupSeconds")?.value||"60";sessionSetup.seconds=secondsValue==="custom"?Math.min(10800,Math.max(1,(Number($("#customMinutes")?.value)||0)*60+(Number($("#customSeconds")?.value)||0))):Math.max(1,Number(secondsValue)||60);sessionSetup.count=$("#setupCount")?.value||"all";let cards=cardsForSetup();if(sessionSetup.mode==="mcq"&&cards.length<4){toast("Multiple choice needs at least 4 cards.");return}if(sessionSetup.mode==="tf"&&cards.length<2){toast("True / False needs at least 2 cards.");return}if(!cards.length){toast("No eligible cards for this session. Add cards or choose another mode.");return}cards=shuffle(cards);if(sessionSetup.count!=="all")cards=cards.slice(0,Number(sessionSetup.count));currentResult=null;currentSession={cards,index:0,correct:0,answered:false,mode:sessionSetup.mode,speedrun:sessionSetup.speedrun,seconds:sessionSetup.seconds,remaining:sessionSetup.seconds,start:Date.now(),hintsUsed:0,revealsUsed:0,flashTotal:cards.length,flashScores:{},known:0,hintUsesRemaining:15,revealUsesRemaining:5,streak:0,bestStreak:0,speedrunScore:0,kind:"core",additionalPool:additionalCardsForSetup(),currentOptions:null,currentTF:null,pickedIndex:null,pickedTF:null,answerMatch:null,overriddenCorrect:false};if(sessionSetup.mode==="mixed"){currentSession.baseMode="mixed";initMixed(currentSession)}closeModal();navigate("study");startSessionTimer()}
/* FN: quickStudy — start study quickly from subject/lesson */
function quickStudy(sid,lid){sessionSetup={...sessionSetup,subject:sid,lesson:lid,mode:"flash",speedrun:false};openSessionSetup(sid,lid)}
/* FN: formatTime — seconds to m:ss string */
function formatTime(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`}
/* FN: makeTF — build true/false prompt for a card in session */
function makeTF(c,pool){
 const back=String(c.back??"").trim(),front=String(c.front??"");
 if(typeof c.tf==="boolean")return{kind:"statement",q:front,a:"",text:front,answer:c.tf};
 if(/^(true|false|tama|mali)$/i.test(back))return{kind:"statement",q:front,a:"",text:front,answer:/^(true|tama)$/i.test(back)};
 if((c.tfStatements||[]).length&&Math.random()<.75){const st=c.tfStatements[Math.random()*c.tfStatements.length|0];return{kind:"statement",q:front,a:"",text:st.s,answer:!!st.a,why:st.why||""}}
 let shown=back,answer=true;
 if(Math.random()<.5){const wrong=buildMCQOptions(c).filter(o=>!o.correct&&!mcqNoneOfAboveAnswer(o.value));if(wrong.length){shown=wrong[Math.random()*wrong.length|0].value;answer=false}}
 return{kind:"pair",q:front,a:shown,text:`${front}  →  ${shown}`,answer,why:answer?"":choiceWhy(c,shown)}
}
/* FN: updateSpeedrunStreak — update streak + score on answer */
function updateSpeedrunStreak(s,correct){if(!s?.speedrun)return;if(correct){s.streak=(s.streak||0)+1;s.bestStreak=Math.max(s.bestStreak||0,s.streak);s.speedrunScore=(s.speedrunScore||0)+100*s.streak}else{s.streak=0}}
/* FN: scheduleFlashCard — SRS-ish requeue for flash ratings */
function scheduleFlashCard(card,level){if(!card?.id)return;const stored=db.subjects.flatMap(s=>s.lessons.flatMap(l=>l.cards)).find(c=>c.id===card.id);if(!stored)return;let box=Math.min(4,Math.max(1,Number(stored.box)||1));if(level==="review")box=1;else if(level==="easy")box=Math.min(4,box+1);stored.box=box;stored.due=Date.now()+[1,2,4,8][box-1]*864e5;save()}
/* FN: startSessionTimer — speedrun countdown timer */
function startSessionTimer(){clearInterval(sessionTimer);sessionTimer=null;const s=currentSession;if(!s?.speedrun)return;s.deadline=Date.now()+Math.max(1,Number(s.seconds)||60)*1000;const tick=()=>{const a=currentSession;if(!a){clearInterval(sessionTimer);sessionTimer=null;return}a.remaining=Math.max(0,Math.ceil((a.deadline-Date.now())/1000));const e=$("#timerValue");if(e){e.textContent=formatTime(a.remaining);e.classList.toggle("low",a.remaining<=10)}if(a.remaining<=0)finishSession(true)};tick();if(currentSession)sessionTimer=setInterval(tick,250)}

/* FN: removeAnimated — animate element out then run callback */

/* FN: countUp — animate number count-up on result stats */

/* FN: migrateLegacyProgress — one-time migrate old progress keys */
function migrateLegacyProgress(){try{if(localStorage.getItem("sf-progress-migrated-v1")==="1")return;const keys=[];let changed=false;for(const s of db.subjects)for(const l of s.lessons){const k="sf-progress-"+l.id,v=localStorage.getItem(k);if(v!==null){keys.push(k);if(l.lastScore===undefined||l.lastScore===null){const score=Math.max(0,Math.min(100,Number(v)||0));l.lastScore=score;l.best=Math.max(Number(l.best)||0,score);changed=true}}}const ok=save();if(ok){keys.forEach(k=>localStorage.removeItem(k));localStorage.setItem("sf-progress-migrated-v1","1")}else if(!changed){/* Keep legacy keys when persistence cannot be verified. */}}catch(e){}}

/* FN: mcqNormalize — normalize text for MCQ compare */
function mcqNormalize(s){return String(s??"").normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim()}
/* FN: mcqTokens — token set for overlap scoring */
function mcqTokens(s){const stop=new Set("a an the and or but if then than of to in on at by for from with without into is are was were be been being this that these those it its as do does did how what when where who whom which why can could should would will may might must i you your yours we our ours they their them he she his her not no yes very more most some any all each every only also about over under between through during before after per via using used use into".split(" "));return new Set(mcqNormalize(s).split(" ").filter(t=>t.length>2&&!stop.has(t)))}

function mcqOverlap(a,b){const A=mcqTokens(a),B=mcqTokens(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(t=>{if(B.has(t))n++});return n/Math.max(1,Math.min(A.size,B.size))}

function mcqPlaceholder(s){const n=mcqNormalize(s);return !n||/^(answer|question|n\/a|na|none|null|undefined|tbd|todo|unknown|example|placeholder|test)$/i.test(n)}

 if(/\b(where|where did|where was|where were|location|located|capital of|city|country|region|place)\b|\b(saan|saan naganap|saan nangyari|saan ginawa|nasaan|lokasyon|lugar|anong bansa|anong lungsod|anong rehiyon)\b/.test(q))return "place";

/* FN: mcqTypeGroup — map fine type to coarse group */
function mcqTypeGroup(type){

function sqFind(name){const n=String(name||"").trim().toLowerCase();return db.subjects.find(x=>x.name.toLowerCase()===n)||db.subjects.find(x=>x.name.toLowerCase().includes(n))}
function sqLesson(s,name){const n=String(name||"").trim().toLowerCase();return s.lessons.find(x=>x.name.toLowerCase()===n)||s.lessons.find(x=>x.name.toLowerCase().includes(n))}
function sqSystem(){const list=db.subjects.map(s=>s.name+"["+s.lessons.map(l=>l.name+":"+l.cards.length).join(",")+"]").join("; ")||"none";return 'Assistant inside StudyQuest flashcard app. Reply short, same language as user, no em dashes. Decks: '+list+'. To act, end reply with lines ACTION {json}. Actions: navigate{view:home|subjects|review|create|about|trash}; create_subject{name,title}; add_cards{subject,lesson,cards:[{front,back,explanation}]}; read_subject{subject} (returns numbered cards, use before editing); edit_card{subject,lesson,n,front?,back?,explanation?}; move_card{subject,lesson,n,to_subject?,to_lesson}; delete_card{subject,lesson,n}; rename_subject{subject,name}; rename_lesson{subject,lesson,name}; start_study{subject}. Only act when asked. Card numbers n are 1-based from read_subject.'}
function sqCut(t,n){t=String(t||"");return t.length>n?t.slice(0,n)+"\u2026":t}
function sqRun(a){try{const d=a.do;
if(d==="navigate"){navigate(a.view);return{m:"Opened "+a.view}}
if(d==="create_subject"){if(!a.name)return{m:"Missing name"};if(db.subjects.some(x=>x.name.toLowerCase()===a.name.toLowerCase()))return{m:"Subject exists"};db.subjects.push({id:uid(),name:a.name,title:a.title||"",createdAt:Date.now(),lessons:[]});save();render();return{m:"Created subject "+a.name}}
if(d==="add_cards"){let s=sqFind(a.subject);if(!s){s={id:uid(),name:a.subject||"My Subject",title:"",createdAt:Date.now(),lessons:[]};db.subjects.push(s)}const ln=a.lesson||"General";let l=s.lessons.find(x=>x.name.toLowerCase()===ln.toLowerCase());if(!l){l={id:uid(),name:ln,term:"General",cards:[]};s.lessons.push(l)}let n=0;(a.cards||[]).forEach(c=>{if(!c||!c.front||!c.back)return;if(l.cards.some(x=>norm(x.front)===norm(c.front)&&norm(x.back)===norm(c.back)))return;l.cards.push(normalizeCard({id:uid(),front:String(c.front),back:String(c.back),explanation:c.explanation||"",hints:[],tags:[],pool:"core"}));n++});save();render();return{m:"Added "+n+" card(s) to "+s.name+" / "+l.name}}
if(d==="start_study"){const s=sqFind(a.subject);if(!s)return{m:"Subject not found"};openSessionSetup(s.id);return{m:"Opened study setup for "+s.name}}
const s=sqFind(a.subject);if(!s)return{m:"Subject not found: "+a.subject};
if(d==="read_subject"){let out="",n=0;for(const l of s.lessons){out+="# "+l.name+"\n";l.cards.forEach((c,i)=>{if(n++<60)out+=(i+1)+". "+sqCut(c.front,80)+" | "+sqCut(c.back,80)+"\n"})}return{m:"Read "+s.name,data:out||"(empty)"}}
if(d==="rename_subject"){if(!a.name)return{m:"Missing name"};s.name=a.name;save();render();return{m:"Renamed subject to "+a.name}}
const l=sqLesson(s,a.lesson);if(!l)return{m:"Lesson not found: "+a.lesson};
if(d==="rename_lesson"){if(!a.name)return{m:"Missing name"};l.name=a.name;save();render();return{m:"Renamed lesson to "+a.name}}
const c=l.cards[(a.n|0)-1];if(!c)return{m:"Card "+a.n+" not found"};
if(d==="edit_card"){["front","back","explanation"].forEach(k=>{if(typeof a[k]==="string")c[k]=a[k]});save();render();return{m:"Edited card "+a.n}}
if(d==="move_card"){const ts=a.to_subject?sqFind(a.to_subject):s;if(!ts)return{m:"Target subject not found"};let tl=sqLesson(ts,a.to_lesson);if(!tl){tl={id:uid(),name:a.to_lesson||"General",term:"General",cards:[]};ts.lessons.push(tl)}l.cards.splice((a.n|0)-1,1);tl.cards.push(c);save();render();return{m:"Moved card to "+ts.name+" / "+tl.name}}
if(d==="delete_card"){if(!confirm("AI wants to delete this card:\n"+sqCut(c.front,100)+"\n\nAllow?"))return{m:"Delete cancelled"};l.cards.splice((a.n|0)-1,1);save();render();return{m:"Deleted card "+a.n}}
return{m:"Unknown action"}}catch(e){return{m:"Action failed: "+e.message}}}
async function sqSend(){if(sqBot.busy)return;const inp=sqEl("sqIn"),t=inp.value.trim();if(!t)return;byokSync();const cfg0=aiResolve();if(cfg0.error){sqAdd("s","Add an API key first: Settings > AI providers.",false);return}const cfg=Object.assign({},cfg0,{p:Object.assign({},cfg0.p,{maxOut:1200})});const c=sqCur();inp.value="";sqAdd("u",t);c.hist.push({role:"user",content:t});sqBot.busy=true;sqBot.ctl=new AbortController();
try{for(let round=0;round<3;round++){const out=sqAdd("b","",false);out.innerHTML=SQ_DOTS;let acc="",first=true;
const msgs=c.hist.slice(-6).map(m=>({role:m.role,content:m.content}));while(msgs.length&&msgs[0].role!=="user")msgs.shift();msgs[0]={role:"user",content:sqSystem()+"\n\n"+msgs[0].content};
await aiStream(cfg,msgs,d=>{acc+=d;const v=acc.replace(/^ACTION .*$/gm,"").trim();if(v){if(first){out.textContent="";first=false}out.textContent=v;sqEl("sqLog").scrollTop=1e9}},sqBot.ctl.signal);
const acts=[...acc.matchAll(/^ACTION\s+(\{.*\})\s*$/gm)],txt=acc.replace(/^ACTION .*$/gm,"").trim();if(!txt)out.remove();else{out.textContent=txt;sqRec("b",txt)}
let fb="",done=[];for(const m of acts){let a;try{a=JSON.parse(m[1])}catch{continue}const r=sqRun(a);sqAdd("s",r.m);done.push(r.m);if(r.data)fb+=r.data}
c.hist.push({role:"assistant",content:(txt||"ok")+(done.length?" [done: "+done.join("; ")+"]":"")});
if(!fb)break;c.hist.push({role:"user",content:"Cards:\n"+fb+"\nContinue the task."})}}
catch(e){sqEl("sqLog").querySelectorAll(".sq-dots").forEach(x=>x.closest(".sqm").remove());sqAdd("s","Error: "+aiFriendly(e))}finally{c.hist=c.hist.slice(-12);sqStoreSave();sqBot.busy=false}}
sqInit();

/* ===== v9: BYOK manager (Settings / Help), fallback, lesson menu ===== */
function openLessonMenu(btn,sid,lid){openActionMenu(btn,[{icon:"pencil",label:"Edit cards",run:()=>{closeModal();openCreate("manual",sid,lid)}},{icon:"pencil",label:"Rename",run:()=>editLesson(sid,lid)},{sep:true},{icon:"trash",label:"Delete",danger:true,run:()=>askDeleteLesson(sid,lid)}])}
const byok={list:[],skip:{}};
try{const j=JSON.parse(localStorage.getItem("sf-byok-v1")||"null");if(j&&Array.isArray(j.list))byok.list=j.list.filter(x=>x&&x.key&&AI_PROVIDERS[x.pid])}catch{}
function byokSave(){try{localStorage.setItem("sf-byok-v1",JSON.stringify({list:byok.list}))}catch{}}
function byokName(e){return e.label||AI_PROVIDERS[e.pid].name}
function byokCfg(e){const p=AI_PROVIDERS[e.pid];return{pid:e.pid,p,key:e.key,model:e.model&&e.model!=="auto"?e.model:p.model,base:e.pid==="custom"?String(e.baseUrl||"").replace(/\/+$/,""):p.base}}
function byokActive(){const n=Date.now();return byok.list.find(x=>!(byok.skip[x.key]>n))||byok.list[0]}
function byokSync(){const e=byokActive(),a=aiState;a.remember=false;if(!e){a.key="";return}a.mode="manual";a.provider=e.pid;a.key=e.key;a.baseUrl=e.baseUrl||"";if(e.model&&e.model!=="auto"){a.model="__custom";a.customModel=e.model}else{a.model="auto";a.customModel=""}}
function byokRefresh(){byokSync();const p=$("#byokPanel");if(p)p.innerHTML=byokSummaryHTML()}
function byokSummaryHTML(){const L=byok.list;return `<div class="eyebrow">Provider · BYOK</div><h3>${L.length?"Your AI providers":"Connect your AI"}</h3><p class="panel-desc">${L.length?"The first key is used. If it hits a limit or is down, the next one takes over.":"Add your API key once. It is used here and in the AI chat."}</p>${L.map((e,i)=>`<div class="byok-row"><div><b>${esc(byokName(e))}</b>${i===0?' <span class="tag">Primary</span>':""}<small>${esc(AI_PROVIDERS[e.pid].name)}</small></div></div>`).join("")}<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openByok()">${icon("settings")}${L.length?"Manage keys":"Add API key"}</button></div>`}
function openByok(){const L=byok.list;openModal(`<div class="modal-head"><div><div class="eyebrow">Settings</div><h2>AI providers (BYOK)</h2><p>Keys stay in this browser. The first one is primary; if it is limited or unavailable, the next is used automatically.</p></div><div class="byok-head-b"><button type="button" class="icon-btn" aria-haspopup="menu" aria-label="More" onclick="openByokMenu(this)">${icon("more")}</button><button class="icon-btn" onclick="closeModal()">×</button></div></div>${L.length?L.map((e,i)=>`<div class="byok-row"><div style="min-width:0"><b>${esc(byokName(e))}</b>${i===0?' <span class="tag">Primary</span>':""}<small>${esc(AI_PROVIDERS[e.pid].name)} · ${esc(e.model||"auto")} · ••••${esc(e.key.slice(-4))}</small></div><div class="byok-btns">${i>0?`<button class="btn small" onclick="byokUp(${i})">Make primary</button>`:""}<button class="btn small danger" onclick="byokDel(${i})">Remove</button></div></div>`).join(""):'<p class="panel-desc">No keys yet. Add one below.</p>'}<div class="byok-add"><div class="field"><label>Provider</label><select id="byProv"><option value="auto">Auto-detect from key</option>${Object.entries(AI_PROVIDERS).map(([k,x])=>`<option value="${k}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>API key</label><input id="byKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-… / sk-ant-… / AIza… / gsk_…"></div><div class="field"><label>Name (optional)</label><input id="byLabel" placeholder="e.g. Gemini backup"></div><div class="field"><label>Model (optional)</label><input id="byModel" placeholder="auto" autocapitalize="off" spellcheck="false"></div><div class="field"><label>Base URL (custom provider only)</label><input id="byBase" placeholder="https://your-host/v1" autocapitalize="off" spellcheck="false"></div><button class="btn primary" onclick="byokAdd()">${icon("plus")}Add key</button></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Done</button></div>`)}
function byokAdd(){const key=$("#byKey").value.trim();let pid=$("#byProv").value;if(!key){toast("Paste an API key first.");return}if(pid==="auto")pid=aiDetect(key);if(!pid||!AI_PROVIDERS[pid]){toast("Can't tell the provider. Choose one.");return}if(byok.list.some(x=>x.key===key&&x.pid===pid)){toast("That key is already added.");return}byok.list.push({id:uid(),pid,key,label:$("#byLabel").value.trim(),model:$("#byModel").value.trim(),baseUrl:$("#byBase").value.trim()});byokSave();byokRefresh();openByok();toast("Key added.")}
function byokUp(i){const e=byok.list.splice(i,1)[0];byok.list.unshift(e);byok.skip={};byokSave();byokRefresh();openByok()}
function byokDel(i){byok.list.splice(i,1);byokSave();byokRefresh();openByok()}
function openByokMenu(btn){openActionMenu(btn,[{icon:"up",label:"Export to TXT",run:byokExport},{icon:"down",label:"Import from TXT",run:byokImportPick}])}
function byokExport(){if(!byok.list.length){toast("No keys to export.");return}downloadText("StudyQuest BYOK backup v1\nKeep this file private. It contains your API keys in plain text.\n#json\n"+JSON.stringify(byok.list,null,1)+"\n","studyquest-byok-backup.txt");toast("Backup downloaded. Keep it private.")}
function byokImportPick(){const f=document.createElement("input");f.type="file";f.accept=".txt,.json,text/plain";f.onchange=async()=>{try{const t=await f.files[0].text(),i=t.search(/[\[{]/);let j=JSON.parse(t.slice(i));if(!Array.isArray(j))j=j.list||[];let n=0;j.forEach(x=>{if(x&&x.key&&AI_PROVIDERS[x.pid]&&!byok.list.some(y=>y.key===x.key&&y.pid===x.pid)){byok.list.push({id:uid(),pid:x.pid,key:String(x.key),label:x.label||"",model:x.model||"",baseUrl:x.baseUrl||""});n++}});byokSave();byokRefresh();openByok();toast(n+" key(s) imported.")}catch{toast("Could not read that file.")}};f.click()}
const _aiStream0=aiStream;
aiStream=async function(cfg,messages,onDelta,signal){let cur=cfg,got=false;const tried=new Set([cfg.key]),od=d=>{got=true;onDelta(d)};
for(;;){try{return await _aiStream0(cur,messages,od,signal)}catch(e){const m=String((e&&e.message)||e);
if(got||(e&&e.name==="AbortError")||!/error (401|402|403|429|500|502|503|504)\b|quota|rate limit|overloaded|high demand|Failed to fetch|NetworkError/i.test(m))throw e;
byok.skip[cur.key]=Date.now()+5*60000;const nx=byok.list.find(x=>!tried.has(x.key));if(!nx)throw e;tried.add(nx.key);cur=byokCfg(nx);byokSync();toast("Switched to "+byokName(nx))}}};
byokSync();
</script>
